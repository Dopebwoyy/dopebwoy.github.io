<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Vendre un bien – ImmoLiqaa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    body { background:#f9f9f9; font-family:Arial,sans-serif; margin:0; }
    header {
      background:#0077cc; color:#fff; padding:18px 0 16px 0; text-align:center; letter-spacing:1px;
      box-shadow:0 2px 12px #0001; border-bottom-left-radius:18px; border-bottom-right-radius:18px;
    }
    .logo { max-width:165px; margin:0 auto 13px auto; display:block; }
    h1 { margin-top:9px; margin-bottom:9px; font-size:1.62em; letter-spacing:.6px; }
    .nav a { color:#fff; text-decoration:underline; font-size:1.07em; }
    .container { max-width:650px; margin:40px auto; background:#fff; padding:28px; border-radius:12px; box-shadow:0 2px 8px #0002; }
    label { font-weight:bold; display:block; margin:15px 0 5px; }
    input, select, textarea {
      width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; font-size:1em;
    }
    textarea { resize:vertical; min-height:100px; }
    button {
      margin-top:20px; padding:12px 20px; background:#0077cc; color:#fff;
      border:none; border-radius:6px; font-size:1.05em; cursor:pointer;
    }
    button:hover { background:#005fa3; }
    footer { text-align:center; color:#666; font-size:.95em; padding:28px 8px 34px; }
  </style>
</head>
<body>
  <header>
    <img src="ChatGPT Image 27 juil. 2025, 18_36_43.png" alt="Logo ImmoLiqaa" class="logo">
    <h1>Vendre un bien</h1>
    <p class="nav" style="margin:15px 0 0 0;">
      <a href="index.html">Accueil</a> &nbsp;|&nbsp;
      <a href="vendre.html">Vendre un bien</a> &nbsp;|&nbsp;
      <a href="apropos.html">À propos</a>
    </p>
  </header>

  <div class="container">
    <h2>Formulaire vendeur</h2>
    <form action="mailto:Contact.ImmoLiqaa@gmail.com" method="post" enctype="text/plain">
      
      <label for="nom">Nom complet</label>
      <input type="text" id="nom" name="Nom" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="Email" required>

      <label for="telephone">Téléphone</label>
      <input type="tel" id="telephone" name="Téléphone" required>

      <label for="type-vente">Type de vente</label>
      <select id="type-vente" name="Type de vente" required>
        <option value="terme">Vente à terme</option>
        <option value="comptant">Vente au comptant</option>
      </select>

      <label for="ville">Ville</label>
      <input type="text" id="ville" name="Ville" required>

      <label for="quartier">Quartier</label>
      <input type="text" id="quartier" name="Quartier">

      <label for="surface">Surface (m²)</label>
      <input type="number" id="surface" name="Surface">

      <label for="prix">Prix demandé (MAD)</label>
      <input type="number" id="prix" name="Prix">

      <label for="details">Détails supplémentaires</label>
      <textarea id="details" name="Détails"></textarea>

      <button type="submit">Envoyer</button>
    </form>
  </div>

  <footer>
    © ImmoLiqaa — Contact : <a href="mailto:Contact.ImmoLiqaa@gmail.com">Contact.ImmoLiqaa@gmail.com</a>
  </footer>
</body>
</html>
